<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>OutfitLens · Mírate, combínate y compra con seguridad</title>
<meta name="description" content="OutfitLens: prueba digitalmente tu outfit y compra con seguridad.">
<meta name="theme-color" content="#3B2436">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Work+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --ivory:#F7F2EC;
  --ivory-soft:#EFE6D8;
  --plum:#3B2436;
  --plum-soft:#54344A;
  --plum-line:#6b4d61;
  --rosebronze:#B8845F;
  --rosebronze-soft:#D8AE86;
  --sage:#6B7A5E;
  --ink:#241A22;
  --danger:#A23E3E;
  --ok:#4C6B4F;
  --radius:18px;
  --radius-sm:10px;
  --shadow: 0 10px 30px rgba(36,26,34,0.14);
  --shadow-sm: 0 4px 14px rgba(36,26,34,0.10);
  --font-display:'Cormorant Garamond', serif;
  --font-body:'Work Sans', sans-serif;
  --font-mono:'Space Mono', monospace;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;}
body{
  font-family:var(--font-body);
  background:var(--ivory);
  color:var(--ink);
  overscroll-behavior-y:none;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,.display{font-family:var(--font-display); font-weight:600; color:var(--plum); margin:0;}
.mono{font-family:var(--font-mono);}
button{font-family:inherit; cursor:pointer;}
input,select,textarea{font-family:inherit;}
a{color:inherit;}
::-webkit-scrollbar{display:none;}

/* ===== Swing tag signature element ===== */
.swing-tag{
  position:relative;
  display:inline-flex;
  align-items:center;
  gap:6px;
  background:var(--ivory);
  border:1px solid var(--rosebronze-soft);
  border-radius:4px 12px 12px 4px;
  padding:4px 10px 4px 18px;
  font-size:12px;
  font-weight:600;
  color:var(--plum-soft);
  white-space:nowrap;
}
.swing-tag::before{
  content:'';
  position:absolute;
  left:7px; top:50%; transform:translateY(-50%);
  width:5px;height:5px;border-radius:50%;
  background:var(--plum);
  box-shadow:0 0 0 1px var(--rosebronze-soft);
}
.swing-tag.price{color:var(--plum); font-family:var(--font-mono); font-size:13px;}
.swing-tag.ticket{font-size:22px; padding:8px 16px 8px 26px;}
.swing-tag.ticket::before{width:8px;height:8px; left:11px;}

/* ===== App shell ===== */
#app{max-width:520px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; background:var(--ivory); position:relative;}
.hidden{display:none !important;}

header.topbar{
  background:linear-gradient(160deg, var(--plum), var(--plum-soft));
  padding:18px 20px 22px;
  color:var(--ivory);
  position:sticky; top:0; z-index:20;
  box-shadow:var(--shadow-sm);
}
.topbar-row{display:flex; align-items:center; justify-content:space-between;}
.brand{display:flex; align-items:center; gap:10px;}
.brand-mark{
  width:34px;height:34px;border-radius:9px;
  background:var(--rosebronze); color:var(--plum);
  display:flex; align-items:center; justify-content:center;
  font-family:var(--font-display); font-weight:700; font-size:16px;
  border:1px solid var(--rosebronze-soft);
}
.brand h1{font-size:22px; color:var(--ivory); letter-spacing:.3px;}
.brand .slogan{font-size:11px; color:var(--rosebronze-soft); letter-spacing:.4px; margin-top:-2px;}
.icon-btn{
  background:rgba(247,242,236,0.12); border:1px solid rgba(247,242,236,0.25);
  color:var(--ivory); border-radius:10px; padding:8px 10px; font-size:16px;
}
.sync-chip{font-size:10px; color:var(--rosebronze-soft); display:flex; align-items:center; gap:4px; margin-top:8px;}
.sync-dot{width:6px;height:6px;border-radius:50%; background:#7cae7e;}
.sync-dot.off{background:#c98b8b;}

main{flex:1; padding:16px 16px 100px; overflow-y:auto;}
.view{animation:fadein .25s ease;}
@keyframes fadein{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}

nav.bottomnav{
  position:sticky; bottom:0; z-index:30;
  background:var(--ivory); border-top:1px solid var(--ivory-soft);
  display:flex; justify-content:space-around; padding:8px 6px calc(8px + env(safe-area-inset-bottom));
  box-shadow:0 -6px 18px rgba(36,26,34,0.06);
}
.navbtn{
  background:none; border:none; display:flex; flex-direction:column; align-items:center; gap:2px;
  color:var(--plum-soft); font-size:10.5px; font-weight:600; padding:6px 10px; border-radius:12px;
}
.navbtn .ic{font-size:20px;}
.navbtn.active{color:var(--rosebronze); background:var(--plum); }
.navbtn.active .ic{filter:drop-shadow(0 0 0 var(--rosebronze));}

/* ===== Cards ===== */
.card{
  background:#fff; border-radius:var(--radius); box-shadow:var(--shadow-sm);
  border:1px solid rgba(59,36,54,0.06); overflow:hidden;
}
.section-title{display:flex; align-items:baseline; justify-content:space-between; margin:22px 0 10px;}
.section-title h2{font-size:20px;}
.section-title .hint{font-size:12px; color:var(--plum-soft); font-weight:500;}

.hero-cta{
  background:linear-gradient(150deg, var(--plum), var(--plum-soft) 70%);
  border-radius:var(--radius); padding:22px 20px; color:var(--ivory); margin-bottom:18px;
  box-shadow:var(--shadow);
}
.hero-cta .eyebrow{font-size:11px; letter-spacing:1.5px; color:var(--rosebronze-soft); font-weight:700; text-transform:uppercase;}
.hero-cta h2{color:var(--ivory); font-size:26px; margin:6px 0 4px;}
.hero-cta p{font-size:13px; color:#e6d9df; margin:0 0 14px; line-height:1.4;}
.btn{
  border:none; border-radius:12px; padding:12px 18px; font-weight:700; font-size:14px;
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
}
.btn-primary{background:var(--rosebronze); color:var(--plum);}
.btn-primary:active{background:var(--rosebronze-soft);}
.btn-outline{background:transparent; border:1.5px solid var(--rosebronze-soft); color:var(--ivory);}
.btn-ghost{background:var(--ivory-soft); color:var(--plum);}
.btn-danger{background:var(--danger); color:#fff;}
.btn-block{width:100%;}
.btn:disabled{opacity:.45;}

.garment-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
.garment-card{display:flex; flex-direction:column; cursor:pointer;}
.img-wrap{aspect-ratio:3/4; background:var(--ivory-soft); overflow:hidden; position:relative;}
.check-box{
  position:absolute; top:8px; right:8px; width:26px; height:26px; border-radius:8px;
  background:rgba(255,255,255,0.85); border:1.5px solid var(--rosebronze-soft);
  display:flex; align-items:center; justify-content:center; font-weight:800; color:var(--sage);
  box-shadow:var(--shadow-sm); font-size:15px;
}
.check-box.on{background:var(--sage); border-color:var(--sage); color:#fff;}
.img-wrap img{width:100%; height:100%; object-fit:cover; display:block;}
.garment-card .no-img{width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:var(--plum-soft); font-size:11px;}
.garment-card .info{padding:10px 10px 12px;}
.garment-card .name{font-family:var(--font-display); font-size:16px; font-weight:600; color:var(--plum); line-height:1.2; margin-bottom:6px;}
.garment-card .meta-row{display:flex; align-items:center; justify-content:space-between; gap:6px; flex-wrap:wrap;}

.empty-state{text-align:center; padding:40px 16px; color:var(--plum-soft);}
.empty-state .ic{font-size:36px; margin-bottom:8px;}

/* ===== Login ===== */
#loginScreen{
  position:fixed; inset:0; z-index:100; background:var(--plum);
  display:flex; align-items:center; justify-content:center; padding:20px;
}
.login-box{
  width:100%; max-width:380px; background:var(--ivory); border-radius:24px; overflow:hidden;
  box-shadow:0 20px 60px rgba(0,0,0,.35); border:1px solid var(--rosebronze-soft);
}
.login-head{background:linear-gradient(160deg, var(--plum), var(--plum-soft)); padding:34px 26px 26px; text-align:center;}
.login-head .brand-mark{margin:0 auto 12px; width:52px; height:52px; font-size:22px; border-radius:14px;}
.login-head h1{color:var(--ivory); font-size:28px;}
.login-head .slogan{color:var(--rosebronze-soft); font-size:12.5px; margin-top:4px; letter-spacing:.3px;}
.login-body{padding:26px;}
.login-body .lead{font-size:13px; color:var(--plum-soft); margin-bottom:16px; text-align:center;}
.field{margin-bottom:14px;}
.field label{display:block; font-size:11.5px; font-weight:700; color:var(--plum-soft); margin-bottom:6px; letter-spacing:.3px; text-transform:uppercase;}
.field input, .field select, .field textarea{
  width:100%; padding:12px 14px; border-radius:10px; border:1.5px solid var(--ivory-soft);
  background:#fff; font-size:14px; color:var(--ink);
}
.field input:focus, .field select:focus, .field textarea:focus{outline:2px solid var(--rosebronze); border-color:var(--rosebronze);}
.error-msg{color:var(--danger); font-size:12.5px; margin:6px 0 0;}
.login-body .skip{text-align:center; margin-top:14px; font-size:12px; color:var(--sage); font-weight:600;}
.auth-toggle{display:flex; background:var(--ivory-soft); border-radius:12px; padding:4px; margin-bottom:16px;}
.auth-toggle-btn{flex:1; border:none; background:transparent; padding:9px; border-radius:9px; font-size:12.5px; font-weight:700; color:var(--plum-soft);}
.auth-toggle-btn.active{background:#fff; color:var(--plum); box-shadow:var(--shadow-sm);}

/* ===== Try-on ===== */
.tryon-stage{
  background:var(--plum); border-radius:var(--radius); overflow:hidden; position:relative;
  aspect-ratio:3/4; display:flex; align-items:center; justify-content:center; box-shadow:var(--shadow);
}
.tryon-stage canvas{width:100%; height:100%; touch-action:none; display:block;}
.tryon-placeholder{color:var(--rosebronze-soft); text-align:center; padding:20px; font-size:13px;}
.tryon-controls{display:flex; flex-direction:column; gap:10px; margin-top:14px;}
.slider-row{display:flex; align-items:center; gap:10px; background:#fff; border-radius:12px; padding:10px 14px; box-shadow:var(--shadow-sm);}
.slider-row label{font-size:12px; font-weight:700; color:var(--plum-soft); width:64px;}
.slider-row input[type=range]{flex:1;}
.tryon-actions{display:flex; gap:10px; margin-top:12px;}
.note-box{background:var(--ivory-soft); border-left:3px solid var(--rosebronze); border-radius:8px; padding:10px 12px; font-size:12px; color:var(--plum-soft); margin-top:10px; line-height:1.4;}

.polaroid{background:#fff; border-radius:14px; padding:10px 10px 16px; box-shadow:var(--shadow); text-align:center;}
.polaroid img{width:100%; border-radius:6px; display:block;}
.polaroid .cap{font-family:var(--font-display); font-size:14px; color:var(--plum-soft); margin-top:8px;}

/* ===== Cart ===== */
.cart-item{display:flex; gap:12px; padding:12px; align-items:center;}
.cart-item img{width:56px;height:70px; object-fit:cover; border-radius:8px; background:var(--ivory-soft);}
.cart-item .ci-info{flex:1;}
.cart-item .ci-name{font-family:var(--font-display); font-weight:600; font-size:15px; color:var(--plum);}
.qty-ctrl{display:flex; align-items:center; gap:8px;}
.qty-ctrl button{width:26px;height:26px;border-radius:50%; border:1px solid var(--rosebronze-soft); background:#fff; color:var(--plum); font-weight:700;}
.cart-total-row{display:flex; justify-content:space-between; align-items:center; padding:16px; background:var(--plum); border-radius:var(--radius); color:var(--ivory); margin-top:14px;}
.cart-total-row .amt{font-family:var(--font-mono); font-size:22px; color:var(--rosebronze-soft);}

/* ===== Modal ===== */
.modal-overlay{position:fixed; inset:0; background:rgba(36,26,34,.55); z-index:80; display:flex; align-items:flex-end; justify-content:center;}
.modal-sheet{background:var(--ivory); width:100%; max-width:520px; border-radius:22px 22px 0 0; max-height:90vh; overflow-y:auto; padding:20px 20px calc(20px + env(safe-area-inset-bottom)); animation:slideup .25s ease;}
@keyframes slideup{from{transform:translateY(30px); opacity:0;} to{transform:translateY(0); opacity:1;}}
.modal-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;}
.modal-head h3{font-size:20px;}
.close-x{background:var(--ivory-soft); border:none; border-radius:50%; width:32px;height:32px; font-size:16px; color:var(--plum);}

/* confirm modal (custom, iOS-safe instead of window.confirm) */
.confirm-box{background:#fff; border-radius:18px; padding:22px; max-width:340px; margin:auto; text-align:center;}
.confirm-box p{font-size:14px; color:var(--ink); margin:10px 0 18px;}
.confirm-actions{display:flex; gap:10px;}

/* ===== Admin ===== */
.tabs-sub{display:flex; gap:8px; overflow-x:auto; padding-bottom:6px; margin-bottom:14px;}
.tab-chip{flex-shrink:0; padding:8px 14px; border-radius:20px; border:1.5px solid var(--ivory-soft); background:#fff; font-size:12.5px; font-weight:700; color:var(--plum-soft);}
.tab-chip.active{background:var(--plum); color:var(--rosebronze-soft); border-color:var(--plum);}
.chk-row{display:flex; flex-wrap:wrap; gap:8px;}
.chk-pill{border:1.5px solid var(--ivory-soft); border-radius:16px; padding:6px 12px; font-size:12px; font-weight:600; color:var(--plum-soft); background:#fff;}
.chk-pill.on{background:var(--sage); border-color:var(--sage); color:#fff;}
.admin-list-item{display:flex; gap:10px; align-items:center; padding:10px; border-bottom:1px solid var(--ivory-soft);}
.admin-list-item img{width:44px;height:56px; object-fit:cover; border-radius:6px; background:var(--ivory-soft);}
.admin-list-item .aname{font-weight:600; font-size:13.5px;}
.admin-list-item .actions{margin-left:auto; display:flex; gap:6px;}
.icobtn{background:var(--ivory-soft); border:none; border-radius:8px; width:30px;height:30px; font-size:13px;}

.summary-panel{border-radius:var(--radius); overflow:hidden; box-shadow:var(--shadow); margin-bottom:6px; border:1px solid rgba(59,36,54,0.08);}
.summary-panel-head{background:linear-gradient(150deg, var(--plum), var(--plum-soft) 70%); color:var(--rosebronze-soft); font-family:var(--font-display); font-size:18px; font-weight:600; padding:16px 18px;}
.summary-panel-body{background:#fff; padding:16px;}
.stat-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:16px;}
.stat-box{background:#fff; border-radius:14px; padding:14px; box-shadow:var(--shadow-sm);}
.stat-box .val{font-family:var(--font-mono); font-size:20px; color:var(--plum); font-weight:700;}
.stat-box .lbl{font-size:11px; color:var(--plum-soft); font-weight:600;}

.ticket-row{background:#fff; border-radius:12px; padding:12px 14px; margin-bottom:8px; box-shadow:var(--shadow-sm);}
.ticket-row .tr-top{display:flex; justify-content:space-between; align-items:center;}
.ticket-row .tr-num{font-family:var(--font-mono); font-weight:700; color:var(--plum);}
.ticket-row .tr-meta{font-size:11.5px; color:var(--plum-soft); margin-top:4px;}

.toast{position:fixed; bottom:90px; left:50%; transform:translateX(-50%); background:var(--plum); color:var(--ivory); padding:10px 18px; border-radius:20px; font-size:13px; z-index:200; box-shadow:var(--shadow); font-weight:600;}

.wa-fab{position:fixed; right:16px; bottom:96px; z-index:40; background:#25D366; color:#fff; border:none; border-radius:50%; width:52px;height:52px; box-shadow:var(--shadow); font-size:22px; display:flex; align-items:center; justify-content:center;}

@media (max-width:360px){ .garment-grid{gap:8px;} }
</style>
</head>
<body>

<!-- ============ LOGIN (solo Admin de la tienda) ============ -->
<div id="loginScreen">
  <div class="login-box">
    <div class="login-head">
      <div class="brand-mark">OL</div>
      <h1>OutfitLens</h1>
      <div class="slogan">Mírate, combínate y compra con seguridad.</div>
    </div>
    <div class="login-body">
      <div class="auth-toggle">
        <button class="auth-toggle-btn active" id="toggleLoginBtn" onclick="setAuthMode('login')">Iniciar sesión</button>
        <button class="auth-toggle-btn" id="toggleRegisterBtn" onclick="setAuthMode('register')">Crear cuenta</button>
      </div>
      <p class="lead" id="authLead">Inicia sesión con tu correo</p>
      <div id="registerFields" class="hidden">
        <div class="field">
          <label>Nombre completo</label>
          <input id="regNombre" type="text" autocomplete="name" placeholder="Tu nombre">
        </div>
        <div class="field">
          <label>Teléfono</label>
          <input id="regTelefono" type="tel" autocomplete="tel" placeholder="09XXXXXXXX">
        </div>
      </div>
      <div class="field">
        <label>Correo</label>
        <input id="loginUser" type="email" autocomplete="off" autocorrect="off" autocapitalize="none" placeholder="tu@correo.com">
      </div>
      <div class="field">
        <label>Contraseña</label>
        <input id="loginPass" type="password" autocomplete="new-password" placeholder="••••••••">
      </div>
      <p class="error-msg hidden" id="loginError">Correo o contraseña incorrectos.</p>
      <button class="btn btn-primary btn-block" id="loginBtn" onclick="doAuthSubmit()">Iniciar sesión</button>
    </div>
  </div>
</div>

<!-- ============ APP ============ -->
<div id="app" class="hidden">
  <header class="topbar">
    <div class="topbar-row">
      <div class="brand">
        <div class="brand-mark">OL</div>
        <div>
          <h1>OutfitLens</h1>
          <div class="slogan">Descubre outfits únicos que reflejan tu estilo</div>
        </div>
      </div>
      <button class="icon-btn" id="sessionBtn" onclick="onSessionBtn()">👤</button>
    </div>
    <div class="sync-chip"><span class="sync-dot off" id="syncDot"></span><span id="syncText">Guardado local</span></div>
  </header>

  <main id="mainArea">
    <!-- views injected by JS -->
  </main>

  <button class="wa-fab hidden" id="waFab" onclick="waCartMessage()" title="Enviar por WhatsApp">💬</button>

  <nav class="bottomnav">
    <button class="navbtn active" data-view="catalogo" onclick="goView('catalogo')"><span class="ic">🛍️</span>Catálogo</button>
    <button class="navbtn" data-view="look" onclick="goView('look')"><span class="ic">📸</span>Mi Look</button>
    <button class="navbtn" data-view="carrito" onclick="goView('carrito')"><span class="ic">🛒</span>Carrito<span id="cartBadge" class="mono" style="font-size:9px;color:var(--rosebronze);"></span></button>
    <button class="navbtn" data-view="cuenta" onclick="goView('cuenta')"><span class="ic">👤</span>Cuenta</button>
  </nav>
</div>

<div id="modalRoot"></div>

<!-- ============ Firebase (SOLO Authentication — el resto de datos vive en Cloudflare D1, ver /functions/api) ============ -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.12.2/firebase-app-compat.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.12.2/firebase-auth-compat.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

<script>
/* =========================================================================
   OUTFITLENS — app.js embebido
   ------------------------------------------------------------------------
   CONFIGURACIÓN FIREBASE — reemplazar UNA sola vez con la de un proyecto
   Firebase que YA TENGAS (de otra app tuya). Solo se usa Authentication,
   por eso no cuenta contra tu límite de proyectos con base de datos.
   Este bloque queda fijo en el código (no hay pantalla para editarlo desde
   la app), así ninguna clienta puede tocar la configuración por accidente.
   Pasos en ese proyecto existente:
   1) console.firebase.google.com → tu proyecto → Authentication → Sign-in
      method → habilita "Correo electrónico/contraseña".
   2) Authentication → Users → Add user → crea el usuario admin de OutfitLens
      (correo + contraseña) — puede ser distinto del admin de tu otra app.
   3) Authentication → Settings → Authorized domains → agrega el dominio
      donde publiques OutfitLens (ej. outfitlens.pages.dev).
   4) Configuración del proyecto → Apps → Web → copia el config aquí abajo
      (es el mismo que ya usas en tu otra app, no hay que crear una app nueva).
   ========================================================================= */
const DEFAULT_FB_CFG = {
  apiKey: "AIzaSyBjAGGv800T0VtBsXEUR1wx-8MXShyLROo",
  authDomain: "agrocacaoapp.firebaseapp.com",
  projectId: "agrocacaoapp",
  appId: "1:47285798681:web:c317537988636c297d6788"
};

/* -------------------------------------------------------------------------
   API de datos — Cloudflare Pages Functions + D1 (SQL). Mismo origen, no
   necesita clave: las funciones en /functions/api/*.js son las únicas que
   hablan con la base D1 "outfitlens-db" (uuid 3af52279-014b-4a7a-8093-2721fc51c265).
   ------------------------------------------------------------------------- */
const API_BASE = '/api';
let apiReady = false;

let STATE = {
  garments: [],
  tickets: [],
  config: { whatsappTienda: "", nombreTienda: "OutfitLens" },
  counters: { ticketSeq: 0 },
  cart: [],           // [{garmentId, nombre, precio, cantidad, imagen}]
  session: { isAdmin: false, mode: null }, // mode: 'admin' | 'usuario' (ya no hay modo invitado)
  miCompras: [],      // historial de compras de la clienta logueada
  misLooks: [],       // looks guardados de la clienta logueada
  misPedidos: [],     // pedidos pendientes/rechazados de la clienta logueada
  pedidos: [],        // pedidos pendientes/procesados (uso admin)
  currentView: 'catalogo',
  look: { garmentId: null, photo: null, x:50, y:35, scale:100, rotate:0, opacity:85, flip:false, savedImg:null }
};

/* ---------------------------- Persistencia local ---------------------------- */
function loadLocal(){
  try{
    const raw = localStorage.getItem('ol_db');
    if(raw){
      const parsed = JSON.parse(raw);
      STATE.garments = parsed.garments || [];
      STATE.tickets = parsed.tickets || [];
      STATE.config = parsed.config || STATE.config;
      STATE.counters = parsed.counters || STATE.counters;
    }
    const cart = localStorage.getItem('ol_cart');
    if(cart) STATE.cart = JSON.parse(cart);
  }catch(e){ console.error('loadLocal', e); }
}
function saveLocal(){
  try{
    localStorage.setItem('ol_db', JSON.stringify({
      garments: STATE.garments, tickets: STATE.tickets,
      config: STATE.config, counters: STATE.counters
    }));
  }catch(e){ console.error('saveLocal (¿localStorage lleno?)', e); }
}
function saveCart(){ localStorage.setItem('ol_cart', JSON.stringify(STATE.cart)); }

/* ---------------------------- Firebase Auth (solo login) ---------------------------- */
let fbAuth = null;
function initAuth(){
  if(DEFAULT_FB_CFG.apiKey.startsWith('REEMPLAZAR')){
    console.warn('Falta configurar DEFAULT_FB_CFG con tu proyecto Firebase existente.');
    return;
  }
  try{
    firebase.initializeApp(DEFAULT_FB_CFG);
    fbAuth = firebase.auth();
  }catch(e){ console.error('Firebase Auth init error', e); }
}
function setSyncStatus(ok, text){
  const dot = document.getElementById('syncDot');
  const txt = document.getElementById('syncText');
  if(dot) dot.classList.toggle('off', !ok);
  if(txt) txt.textContent = (ok?'🟢 ':'') + text;
}

/* ---------------------------- API de datos (Cloudflare D1) ---------------------------- */
async function apiFetch(path, options){
  const res = await fetch(API_BASE + path, {
    headers: {'Content-Type':'application/json'},
    ...options
  });
  if(!res.ok) throw new Error('API '+path+' → '+res.status);
  return res.json();
}
async function apiLoadAll(){
  try{
    const [garments, tickets, config, pedidos] = await Promise.all([
      apiFetch('/garments'), apiFetch('/tickets'), apiFetch('/config'), apiFetch('/pedidos')
    ]);
    STATE.garments = garments;
    STATE.tickets = tickets;
    STATE.config = {...STATE.config, ...config};
    STATE.pedidos = pedidos;
    apiReady = true;
    saveLocal();
    setSyncStatus(true, 'Conectado (Cloudflare D1)');
    if(['catalogo','look'].includes(STATE.currentView)) render();
    if(STATE.currentView==='cuenta' && STATE.session.mode==='admin' && adminTab==='pedidos') render();
  }catch(e){
    console.error('No se pudo conectar a la API D1, usando datos locales', e);
    apiReady = false;
    setSyncStatus(false, 'Modo local (sin conexión a la base)');
  }
}
async function fbSaveGarment(g){
  saveLocal();
  try{ await apiFetch('/garments', {method:'POST', body:JSON.stringify(g)}); }
  catch(e){ console.error(e); toast('Se guardó localmente; no se pudo sincronizar con D1'); }
}
async function fbDeleteGarment(id){
  saveLocal();
  try{ await apiFetch('/garments/'+id, {method:'DELETE'}); }
  catch(e){ console.error(e); }
}
async function fbSaveConfig(){
  saveLocal();
  try{ await apiFetch('/config', {method:'POST', body:JSON.stringify(STATE.config)}); }
  catch(e){ console.error(e); }
}
/* Crea el ticket en el servidor: el folio secuencial lo asigna D1 de forma
   atómica (evita que dos ventas simultáneas usen el mismo número). */
async function apiCreateTicket(payload){
  try{
    const ticket = await apiFetch('/tickets', {method:'POST', body:JSON.stringify(payload)});
    STATE.tickets.unshift(ticket);
    saveLocal();
    return ticket;
  }catch(e){
    console.error('Fallo al crear ticket en D1, se genera folio local temporal', e);
    STATE.counters.ticketSeq = (STATE.counters.ticketSeq||0)+1;
    const numero = STATE.counters.ticketSeq;
    const ticket = {id:'tk_'+Date.now(), numero, folio:'OL-'+String(numero).padStart(6,'0')+'-LOCAL', ...payload};
    STATE.tickets.unshift(ticket);
    saveLocal();
    return ticket;
  }
}

/* ---------------------------- Login / Registro (Firebase Auth) ---------------------------- */
// Correos con acceso de administrador. Editar aquí para agregar más (ej. vendedoras de confianza).
const ADMIN_EMAILS = ['admin@outfitlens.com'];

let authMode = 'login'; // 'login' | 'register'
function setAuthMode(mode){
  authMode = mode;
  document.getElementById('toggleLoginBtn').classList.toggle('active', mode==='login');
  document.getElementById('toggleRegisterBtn').classList.toggle('active', mode==='register');
  document.getElementById('registerFields').classList.toggle('hidden', mode!=='register');
  document.getElementById('authLead').textContent = mode==='login' ? 'Inicia sesión con tu correo' : 'Crea tu cuenta de clienta';
  document.getElementById('loginBtn').textContent = mode==='login' ? 'Iniciar sesión' : 'Crear cuenta';
  document.getElementById('loginError').classList.add('hidden');
}
function doAuthSubmit(){
  if(authMode==='login') doLogin(); else doRegister();
}
async function resolveSessionAfterAuth(user){
  const isAdmin = ADMIN_EMAILS.includes((user.email||'').toLowerCase());
  if(isAdmin){
    STATE.session = {isAdmin:true, mode:'admin', email:user.email, uid:user.uid};
  }else{
    STATE.session = {isAdmin:false, mode:'usuario', email:user.email, uid:user.uid, profile:null};
    await loadMiCuentaData();
  }
  localStorage.setItem('ol_auth', JSON.stringify({isAdmin:STATE.session.isAdmin, mode:STATE.session.mode, email:user.email, uid:user.uid}));
}
async function doLogin(){
  const email = document.getElementById('loginUser').value.trim();
  const pass = document.getElementById('loginPass').value;
  const btn = document.getElementById('loginBtn');
  document.getElementById('loginError').classList.add('hidden');
  if(!fbAuth){ document.getElementById('loginError').textContent = 'Firebase Auth no está configurado todavía (ver DEFAULT_FB_CFG en el código).'; document.getElementById('loginError').classList.remove('hidden'); return; }
  btn.disabled = true; btn.textContent = 'Ingresando…';
  try{
    const cred = await fbAuth.signInWithEmailAndPassword(email, pass);
    await resolveSessionAfterAuth(cred.user);
    enterApp();
  }catch(e){
    document.getElementById('loginError').textContent = 'Correo o contraseña incorrectos.';
    document.getElementById('loginError').classList.remove('hidden');
  }finally{
    btn.disabled = false; btn.textContent = authMode==='login' ? 'Iniciar sesión' : 'Crear cuenta';
  }
}
async function doRegister(){
  const nombre = document.getElementById('regNombre').value.trim();
  const telefono = document.getElementById('regTelefono').value.trim();
  const email = document.getElementById('loginUser').value.trim();
  const pass = document.getElementById('loginPass').value;
  const btn = document.getElementById('loginBtn');
  document.getElementById('loginError').classList.add('hidden');
  if(!fbAuth){ document.getElementById('loginError').textContent = 'Firebase Auth no está configurado todavía.'; document.getElementById('loginError').classList.remove('hidden'); return; }
  if(!nombre){ document.getElementById('loginError').textContent = 'Ingresa tu nombre.'; document.getElementById('loginError').classList.remove('hidden'); return; }
  if(!pass || pass.length<6){ document.getElementById('loginError').textContent = 'La contraseña debe tener al menos 6 caracteres.'; document.getElementById('loginError').classList.remove('hidden'); return; }
  btn.disabled = true; btn.textContent = 'Creando cuenta…';
  try{
    const cred = await fbAuth.createUserWithEmailAndPassword(email, pass);
    try{
      await apiFetch('/users', {method:'POST', body:JSON.stringify({uid:cred.user.uid, email, nombre, telefono, creado:todayISO()})});
    }catch(e){ console.error('No se pudo guardar el perfil en D1', e); }
    await resolveSessionAfterAuth(cred.user);
    STATE.session.profile = {nombre, telefono};
    enterApp();
    toast(`¡Bienvenida, ${nombre}! 🎉`);
  }catch(e){
    document.getElementById('loginError').textContent = e.code==='auth/email-already-in-use' ? 'Ese correo ya tiene una cuenta — inicia sesión en vez de registrarte.' : 'No se pudo crear la cuenta. Revisa el correo y la contraseña.';
    document.getElementById('loginError').classList.remove('hidden');
  }finally{
    btn.disabled = false; btn.textContent = authMode==='login' ? 'Iniciar sesión' : 'Crear cuenta';
  }
}
async function loadMiCuentaData(){
  if(!STATE.session.uid) return;
  try{
    const data = await apiFetch('/users/'+STATE.session.uid);
    STATE.session.profile = data.profile;
    STATE.miCompras = data.tickets || [];
    STATE.misLooks = data.looks || [];
    STATE.misPedidos = data.pedidos || [];
  }catch(e){ console.error('No se pudo cargar el historial de la clienta', e); }
}
function clearLoginFields(){
  const ids = ['loginUser','loginPass','regNombre','regTelefono'];
  ids.forEach(id=>{ const el = document.getElementById(id); if(el) el.value=''; });
  const err = document.getElementById('loginError');
  if(err) err.classList.add('hidden');
}
function logout(){
  const esAdmin = STATE.session.isAdmin;
  confirmModal('Cerrar sesión', esAdmin ? '¿Deseas salir del modo administrador?' : '¿Deseas cerrar tu sesión?', ()=>{
    if(fbAuth) fbAuth.signOut().catch(()=>{});
    STATE.session = {isAdmin:false, mode:null};
    STATE.miCompras = []; STATE.misLooks = []; STATE.misPedidos = [];
    STATE.cart = []; saveCart();
    localStorage.removeItem('ol_auth');
    closeModal();
    document.getElementById('app').classList.add('hidden');
    document.getElementById('loginScreen').classList.remove('hidden');
    setAuthMode('login');
    clearLoginFields();

}

function enterApp(){

function garmentCard(g){

function categoriaLabel(c, principal){
  const sub = {pantalon:'Pantalón',blusa:'Blusa',chaqueta:'Chaqueta',vestido:'Vestido',calzado:'Calzado',falda:'Falda',camisa:'Camisa',collares:'Collares',aretes:'Aretes',tobilleras:'Tobilleras',chompas:'Chompas',bleiser:'Bléiser'}[c];
  return sub || principal || (c? c.charAt(0).toUpperCase()+c.slice(1) : 'Prenda');
}
function generoLabel(g){ return {dama:'Dama',caballero:'Caballero',nino:'Niño/a',unisex:'Unisex'}[g]||g||''; }

/* Marcar/desmarcar el check de una prenda en el catálogo: reserva en D1
   (estado disponible -> en_carrito) y la mueve al carrito. Si alguien más
   ya la reservó primero, avisa y refresca la vista. */
async function toggleGarmentCheck(id){
  const enCarrito = STATE.cart.some(i=>i.garmentId===id);
  if(enCarrito){ await releaseGarment(id); }
  else{ await reserveGarment(id); }
}
async function reserveGarment(id){
  const g = STATE.garments.find(x=>x.id===id);
  if(!g) return;
  try{
    await apiFetch('/garments/'+id, {method:'PATCH', body:JSON.stringify({estado:'en_carrito', esperado:'disponible'})});
    g.estado='en_carrito';
    STATE.cart.push({garmentId:id, nombre:g.nombre, precio:g.precio, cantidad:1, imagen:g.imagen, categoria:g.categoria, categoriaPrincipal:g.categoriaPrincipal});
    saveCart(); saveLocal(); updateCartBadge();
    toast('Añadido a tu carrito 🛍️');
    render();
  }catch(e){
    if(e.message && e.message.includes('409')){
      toast('Uy, esa prenda ya la reservó otra clienta');
      await apiLoadAll();
    }else{
      // Sin conexión a la API: reserva solo local (modo offline)
      g.estado='en_carrito';
      STATE.cart.push({garmentId:id, nombre:g.nombre, precio:g.precio, cantidad:1, imagen:g.imagen, categoria:g.categoria, categoriaPrincipal:g.categoriaPrincipal});
      saveCart(); saveLocal(); updateCartBadge();
    }
    render();
  }
}
async function releaseGarment(id){
  const g = STATE.garments.find(x=>x.id===id);
  STATE.cart = STATE.cart.filter(i=>i.garmentId!==id);
  saveCart(); updateCartBadge();
  if(g){ g.estado='disponible'; saveLocal(); }
  try{ await apiFetch('/garments/'+id, {method:'PATCH', body:JSON.stringify({estado:'disponible'})}); }
  catch(e){ console.error(e); }
  render();
}

function drawTryOnCanvas(g){
  const canvas = document.getElementById('tryonCanvas');
  if(!canvas || !STATE.look.photo) return;
  const ctx = canvas.getContext('2d');
  const baseImg = new Image();
  baseImg.onload = ()=>{
    canvas.width = baseImg.width; canvas.height = baseImg.height;
    ctx.clearRect(0,0,canvas.width, canvas.height);
    ctx.drawImage(baseImg,0,0);
    if(g && g.imagen){
      const gi = new Image();
      gi.onload = ()=>{
        const scale = STATE.look.scale/100;
        const gw = canvas.width * 0.5 * scale;
        const gh = gw * (gi.height/gi.width);
        const cx = canvas.width * (STATE.look.x/100);
        const cy = canvas.height * (STATE.look.y/100);
        ctx.save();
        ctx.globalAlpha = STATE.look.opacity/100;
        ctx.translate(cx, cy);
        ctx.rotate(STATE.look.rotate * Math.PI/180);
        if(STATE.look.flip) ctx.scale(-1,1);
        ctx.drawImage(gi, -gw/2, -gh/2, gw, gh);
        ctx.restore();
      };
      gi.src = g.imagen;
    }
  };
  baseImg.src = STATE.look.photo;
}
async function saveLookSnapshot(){
  const canvas = document.getElementById('tryonCanvas');
  if(!canvas) return;
  STATE.look.savedImg = canvas.toDataURL('image/jpeg',0.9);
  const g = STATE.garments.find(x=>x.id===STATE.look.garmentId);
  if(STATE.session.mode==='usuario' && STATE.session.uid){
    try{
      await apiFetch('/looks', {method:'POST', body:JSON.stringify({
        uid: STATE.session.uid, garmentId: STATE.look.garmentId, garmentNombre: g?g.nombre:'', imagen: STATE.look.savedImg
      })});
      STATE.misLooks.unshift({id:'lk_'+Date.now(), garmentId:STATE.look.garmentId, garmentNombre:g?g.nombre:'', imagen:STATE.look.savedImg});
      toast('Look guardado en tu cuenta ✨');
    }catch(e){
      console.error(e);
      toast('Look guardado (no se pudo sincronizar con tu cuenta)');
    }
  }else{
    toast('Look guardado ✨ — crea una cuenta para conservarlo en "Mis looks"');
  }
  render();
}

function downloadTicketPDF(ticketId){
  const t = STATE.tickets.find(x=>x.id===ticketId);
  if(!t) return;
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({unit:'mm', format:[80, 150]});
  let y = 10;
  doc.setFont('helvetica','bold'); doc.setFontSize(13);
  doc.text(STATE.config.nombreTienda || 'OutfitLens', 40, y, {align:'center'}); y+=6;
  doc.setFontSize(8); doc.setFont('helvetica','normal');
  doc.text('Mirate, combinate y compra con seguridad', 40, y, {align:'center'}); y+=6;
  doc.setLineWidth(0.2); doc.line(6,y,74,y); y+=6;
  doc.setFontSize(10); doc.setFont('helvetica','bold');
  doc.text('Ticket: '+t.folio, 6, y); y+=6;
  doc.setFont('helvetica','normal'); doc.setFontSize(8);
  doc.text('Fecha: '+fmtDate(t.fecha), 6, y); y+=5;
  doc.text('Cliente: '+t.cliente.nombre, 6, y); y+=5;
  if(t.cliente.telefono){ doc.text('Telefono: '+t.cliente.telefono, 6, y); y+=5; }
  doc.text('Genero: '+generoLabel(t.cliente.genero)+'  Tipo: '+t.cliente.tipo, 6, y); y+=6;
  doc.line(6,y,74,y); y+=6;
  t.items.forEach(i=>{
    doc.text(`${i.cantidad}x ${i.nombre}`.substring(0,34), 6, y);
    doc.text('$'+(i.precio*i.cantidad).toFixed(2), 74, y, {align:'right'});
    y+=5;
  });
  doc.line(6,y,74,y); y+=6;
  doc.setFont('helvetica','bold'); doc.setFontSize(11);
  doc.text('TOTAL', 6, y); doc.text('$'+t.total.toFixed(2), 74, y, {align:'right'}); y+=8;
  doc.setFont('helvetica','normal'); doc.setFontSize(7);
  doc.text('Gracias por tu compra ✨', 40, y, {align:'center'});
  doc.save(t.folio+'.pdf');
}

async function saveNewGarment(){
  const nombre = document.getElementById('ngNombre').value.trim();
  const precio = parseFloat(document.getElementById('ngPrecio').value)||0;
  const cantidad = Math.max(1, parseInt(document.getElementById('ngCantidad').value)||1);
  if(!nombre){ toast('Ingresa el nombre de la prenda'); return; }
  const PRINCIPAL_TO_CATEGORIA = {Ropa:'ropa', Collares:'collares', Aretes:'aretes', Tobilleras:'tobilleras', Chompas:'chompas', 'Bléiser':'bleiser'};
  const subCategoria = newGarmentPrincipal==='Ropa'
    ? document.getElementById('ngCategoria').value
    : (PRINCIPAL_TO_CATEGORIA[newGarmentPrincipal] || newGarmentPrincipal.toLowerCase());
  const base = {
    nombre, precio,
    categoriaPrincipal: newGarmentPrincipal,
    categoria: subCategoria,
    genero: document.getElementById('ngGenero').value,
    tallas: Array.from(newGarmentTallas),
    combinaCon: Array.from(newGarmentCombina),
    imagen: newGarmentImg,
    activo: true,
    estado: 'disponible',
    creado: todayISO()
  };
  const nuevas = [];
  for(let i=0; i<cantidad; i++){
    const g = {...base, id: 'g_'+Date.now()+'_'+i};
    nuevas.push(g);
    STATE.garments.unshift(g);
  }
  for(const g of nuevas){ await fbSaveGarment(g); }
  newGarmentImg=null; newGarmentTallas=new Set(); newGarmentCombina=new Set(); newGarmentPrincipal='Ropa';

/* ----- Reporte (inventario + ventas por categoría): pantalla + Excel ----- */
function reporteInventarioPorCategoria(){
  const filas = CATEGORIAS_PRINCIPALES.map(cat=>{
    const items = STATE.garments.filter(g=>(g.categoriaPrincipal||'Ropa')===cat);
    const disponibles = items.filter(g=>g.activo!==false && (g.estado||'disponible')==='disponible');
    const reservadas = items.filter(g=>g.estado==='en_carrito');
    const vendidas = items.filter(g=>g.estado==='vendido');
    return {
      categoria: cat,
      disponibles: disponibles.length,
      reservadas: reservadas.length,
      vendidas: vendidas.length,
      valorDisponible: disponibles.reduce((s,g)=>s+(g.precio||0),0)
    };
  });
  return filas;
}
function reporteVentasPorCategoria(){
  const acc = {};
  CATEGORIAS_PRINCIPALES.forEach(c=> acc[c] = {unidades:0, total:0});
  STATE.tickets.forEach(t=>{
    (t.items||[]).forEach(i=>{
      const cat = i.categoriaPrincipal || 'Ropa';
      if(!acc[cat]) acc[cat] = {unidades:0, total:0};
      acc[cat].unidades += i.cantidad||1;
      acc[cat].total += (i.precio||0)*(i.cantidad||1);
    });
  });
  return Object.entries(acc).map(([categoria, v])=>({categoria, ...v}));
}

/* ----- Respaldo / Restauración ----- */
function adminRespaldo(){
  return `
    <div class="card" style="padding:16px;">
      <p style="font-size:12.5px;color:var(--plum-soft);margin-bottom:12px;">Descarga un respaldo completo (prendas con fotos, tickets y configuración) o restaura uno anterior.</p>

      <div style="margin-top:12px;">
        <label style="display:block;font-size:11.5px;font-weight:700;color:var(--plum-soft);margin-bottom:6px;">RESTAURAR DESDE ARCHIVO</label>
        <input type="file" accept="application/json" onchange="restoreBackup(event)">
      </div>
    </div>
  `;
}
function downloadBackup(){
  const data = {
    version:1, exportado: todayISO(),
    garments: STATE.garments, tickets: STATE.tickets, config: STATE.config, counters: STATE.counters
  };
  const blob = new Blob([JSON.stringify(data,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download = `outfitlens-respaldo-${Date.now()}.json`; a.click();
  URL.revokeObjectURL(url);
}
function restoreBackup(ev){
  const file = ev.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    confirmModal('Restaurar respaldo', 'Esto reemplazará el catálogo, tickets y configuración actuales. ¿Continuar?', async ()=>{
      try{
        const data = JSON.parse(reader.result);
        STATE.garments = data.garments||[];
        STATE.tickets = data.tickets||[];
        STATE.config = data.config||STATE.config;
        STATE.counters = data.counters||STATE.counters;
        saveLocal();
        if(apiReady){
          for(const g of STATE.garments) await fbSaveGarment(g);
          await fbSaveConfig();
        }
        closeModal();
        toast('Respaldo restaurado ✅ (los tickets se mantienen tal como están en la base; solo se restauran prendas y configuración)');
        setAdminTab('resumen');
      }catch(e){ toast('El archivo no es un respaldo válido'); }
    });
  };
  reader.readAsText(file);
}

/* =========================================================================
   Utilidades
   ========================================================================= */
function esc(s){ return (s||'').toString().replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function compressImageFile(file, maxW, quality){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>{
      const img = new Image();
      img.onload = ()=>{
        const scale = Math.min(1, maxW/img.width);
        const w = Math.round(img.width*scale), h = Math.round(img.height*scale);
        const canvas = document.createElement('canvas'); canvas.width=w; canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

/* Modal genérico */
function openModal(html){
  document.getElementById('modalRoot').innerHTML = `<div class="modal-overlay" onclick="if(event.target===this) closeModal()"><div class="modal-sheet">${html}</div></div>`;
}
function closeModal(){ document.getElementById('modalRoot').innerHTML=''; }
/* Confirm modal a la medida (reemplaza window.confirm para compatibilidad iOS) */
function confirmModal(title, msg, onYes){
  document.getElementById('modalRoot').innerHTML = `
    <div class="modal-overlay">
      <div class="confirm-box">
        <h3 style="font-size:18px;">${esc(title)}</h3>
        <p>${esc(msg)}</p>
        <div class="confirm-actions">
          <button class="btn btn-ghost" style="flex:1;" onclick="closeModal()">Cancelar</button>
          <button class="btn btn-danger" style="flex:1;" id="confirmYesBtn">Sí, continuar</button>
        </div>
      </div>
    </div>`;
  document.getElementById('confirmYesBtn').onclick = onYes;
}

   ========================================================================= */
window.addEventListener('load', async ()=>{
  loadLocal();
  initAuth();
  apiLoadAll();
  const auth = localStorage.getItem('ol_auth');
  if(auth){
    try{ STATE.session = JSON.parse(auth); }catch(e){}
  }
  if(STATE.session && STATE.session.mode==='usuario' && STATE.session.uid){
    await loadMiCuentaData();
  }
  if(STATE.session && STATE.session.mode){
    enterApp();
  }else{
    clearLoginFields();
  }
  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('sw.js').catch(e=>console.warn('SW registro falló', e));
  }
  // Actualiza el catálogo cada 12s (mientras la pestaña está visible) para que
  // las reservas hechas desde otro celular/dispositivo se reflejen aquí,
  // ya que las prendas son piezas únicas de garage sale.
  setInterval(()=>{ if(document.visibilityState==='visible') apiLoadAll(); }, 12000);
  document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible') apiLoadAll(); });
});
